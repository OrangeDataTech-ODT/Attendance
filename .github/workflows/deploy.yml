name: Build and Deploy to VM

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      no_cache:
        description: "Force rebuild"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/orangedatatech-odt/attendance
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - name: Verify new API exists in code
        run: |
          echo "Checking if API exists in repo"
          grep -r "auto-group-entry" . || (echo "❌ API NOT FOUND" && exit 1)

      - name: Debug
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Repo: ${{ github.repository }}"

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event.inputs.no_cache == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            echo "🔐 Login to GHCR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            echo "📥 Pull latest image"
            docker pull ghcr.io/orangedatatech-odt/attendance:${{ github.sha }}
            echo "🧹 Cleaning old dangling Docker images"
            docker image prune -f

            echo "🛑 Stop old container"
            docker stop attendance || true
            docker rm attendance || true

            echo "🚀 Run new container"
            docker run -d \
              --name attendance \
              -p 8000:8000 \
              -e DJANGO_SECRET_KEY='${{ secrets.DJANGO_SECRET_KEY }}' \
              -e API_KEY_VALUE='${{ secrets.API_KEY_VALUE }}' \
              -e BLOB_READ_WRITE_TOKEN='${{ secrets.BLOB_READ_WRITE_TOKEN }}' \
              -e DATABASE_URL='${{ secrets.DATABASE_URL }}' \
              -e RENDER_EXTERNAL_URL='${{ secrets.RENDER_EXTERNAL_URL }}' \
              -e VITE_API_DEPLOY_URL='${{ secrets.VITE_API_DEPLOY_URL }}' \
              -e NODE_ENV=production \
              -e LOG_LEVEL=INFO \
              -e APP_PORT=8000 \
              -e USE_INTERNAL_SCHEDULER=True \
              -e RUN_SCHEDULER=1 \
              ghcr.io/orangedatatech-odt/attendance:${{ github.sha }}
            echo "⏳ Waiting for app stabilization..."
            sleep 3

            echo "🔍 Verifying container..."
            docker ps | grep attendance && echo "✅ Container running" || (echo "❌ Container failed" && exit 1)

            echo "🎉 Deployment successful!"
